<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VALO AIM TRAINER — Browser Deathmatch Aim Trainer</title>
<meta name="description" content="VALORANT の感度・FOV・移動（ストッピング）・リコイル・武器特性を組み込んだ、ブラウザで即起動できる BOT デスマッチ型エイムトレーナー / Browser bot-deathmatch aim trainer with VALORANT-style sensitivity, counter-strafing and recoil">
<meta property="og:type" content="website">
<meta property="og:title" content="VALO AIM TRAINER — Browser Deathmatch Aim Trainer">
<meta property="og:description" content="マッチング待ちに、ブラウザで即デスマッチ。撃ち返してくる BOT とオリジナルマップで撃ち合い、ストッピングとリコイル制御を練習。">
<meta property="og:url" content="https://xs288120.xsrv.jp/R6SAIM/valorant/">
<meta property="og:image" content="https://xs288120.xsrv.jp/R6SAIM/valorant/img/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0f1923">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230f1923'/%3E%3Cpath d='M4 6h6l6 14 6-14h6L19 27h-6z' fill='%23ff4655'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gl"></canvas>

<!-- HUD (in-game) -->
<div id="hud" class="hidden">
  <canvas id="xh"></canvas>
  <div id="ads-ov" class="hidden"></div>
  <div id="scope-ov" class="hidden"><i class="h"></i><i class="v"></i><b id="scope-dot"></b></div>
  <div id="hitmark"><i></i><i></i><i></i><i></i></div>
  <div id="killmsg"></div>
  <div id="hurt"></div>
  <div id="dmgdir"></div>
  <div id="hit-flash"></div>
  <canvas id="minimap" class="dm-only" width="200" height="200"></canvas>
  <div id="hud-top">
    <div class="hb"><span class="lbl">TIME</span><span id="h-time">0:00</span></div>
    <div class="hb weapon-only"><span class="lbl">KILLS</span><span><span id="h-kills">0</span><small id="h-goal"></small></span></div>
    <div class="hb dm-only"><span class="lbl">RANK</span><span id="h-rank">#1</span></div>
    <div class="hb nodm"><span class="lbl">SCORE</span><span id="h-score2">0</span></div>
    <div class="hb"><span class="lbl">ACC</span><span id="h-acc">0%</span></div>
    <div class="hb weapon-only"><span class="lbl">STOP</span><span id="h-stop">—</span></div>
  </div>
  <div id="hud-meta"><span id="h-fps">0</span> FPS · <span id="h-hz">0</span> Hz</div>
  <div id="killfeed" class="dm-only"></div>
  <div id="hud-hp" class="dm-only">
    <div class="armor"><span class="lbl">SHIELD</span><span id="h-armor">50</span></div>
    <div class="hp"><span id="h-hp">100</span></div>
  </div>
  <div id="speedo" class="weapon-only"><div class="track"><div id="speedo-bar"></div><i class="dz"></i></div><span id="speedo-s">ACCURATE</span><span id="speedo-v">0.00 m/s</span></div>
  <div id="hud-ammo" class="weapon-only">
    <div class="ammo"><span id="h-ammo">25</span><span class="sl">/</span><span id="h-res">50</span></div>
    <div class="gun"><span id="h-gun">VANDAL</span><span id="h-zoom"></span></div>
    <div id="h-slots"><i data-s="1"><b>1</b><span id="h-s1"></span></i><i data-s="2"><b>2</b><span id="h-s2"></span></i><i data-s="3"><b>3</b><span>Knife</span></i></div>
  </div>
  <div id="hud-bottom"><span id="h-mode"></span> · <span id="h-sens"></span><span class="dim" id="h-keys"></span></div>
  <div id="protect" class="hidden">SPAWN PROTECTION</div>
  <div id="death" class="hidden"><div class="eyebrow">ELIMINATED BY</div><div id="death-by"></div><div class="rs">RESPAWN <span id="death-t">1.5</span></div></div>
  <div id="scoreboard" class="hidden"><table><thead><tr><th>#</th><th>PLAYER</th><th>K</th><th>D</th></tr></thead><tbody id="sb-body"></tbody></table></div>
</div>

<!-- MENU -->
<div id="menu">
  <div class="bg"></div>
  <header>
    <div class="brandbox">
      <div class="logo"><span class="v">VALO</span> AIM TRAINER</div>
      <div class="sub" data-i18n="hdr.sub"></div>
    </div>
    <div class="tools">
      <button id="open-guide" type="button" class="ghost" data-i18n="hdr.guide"></button>
      <div class="lang"><button data-lang="ja">日本語</button><button data-lang="en">EN</button></div>
    </div>
  </header>

  <nav class="modeswitch">
    <button id="ms-dm" class="ms main on" data-mm="dm">
      <img src="img/hero-dm.webp" alt="" width="132" height="132" decoding="async">
      <span class="ms-k">MAIN MODE</span>
      <span class="ms-t">DEATHMATCH</span><span class="ms-d" data-i18n="ms.dm.d"></span>
    </button>
    <button id="ms-lab" class="ms" data-mm="lab">
      <img src="img/mode-stopping.webp" alt="" width="84" height="84" decoding="async">
      <span class="ms-k">PRACTICE</span>
      <span class="ms-t">DRILLS</span><span class="ms-d" data-i18n="ms.drills.d"></span>
    </button>
  </nav>

  <main>
    <section id="pane-dm" class="panel modes-panel">
      <h2><span data-i18n="dm.h2"></span><small data-i18n="dm.h2s"></small></h2>
      <div class="presets">
        <span data-i18n="preset.lbl"></span>
        <button type="button" data-preset="quick" data-i18n="preset.quick"></button>
        <button type="button" data-preset="std" data-i18n="preset.std"></button>
        <button type="button" data-preset="real" data-i18n="preset.real"></button>
      </div>
      <div class="grid g3">
        <label><span data-i18n="lbl.map"></span> <select id="map">
          <option value="sandstone" data-i18n="map.sandstone"></option>
          <option value="dock" data-i18n="map.dock"></option>
          <option value="lab" data-i18n="map.lab"></option>
        </select></label>
        <label><span data-i18n="lbl.primary"></span> <select id="primary"></select></label>
        <label><span data-i18n="lbl.secondary"></span> <select id="secondary"></select></label>
        <label><span data-i18n="lbl.bots"></span> <select id="bots">
          <option value="1">1</option><option value="3">3</option><option value="5">5</option><option value="7">7</option><option value="9">9</option><option value="11" data-i18n="bots.11"></option>
        </select></label>
        <label><span data-i18n="lbl.botdiff"></span> <select id="botDiff">
          <option value="easy">Easy</option><option value="normal">Normal</option><option value="hard">Hard</option><option value="insane">Insane</option>
        </select></label>
        <label><span data-i18n="lbl.shootback"></span> <select id="shootBack">
          <option value="1" data-i18n="sb.on"></option><option value="0" data-i18n="sb.off"></option>
        </select></label>
        <label><span data-i18n="lbl.botmove"></span> <select id="botMove">
          <option value="static" data-i18n="bm.static"></option><option value="walk" data-i18n="bm.walk"></option><option value="normal" data-i18n="bm.normal"></option><option value="wild" data-i18n="bm.wild"></option>
        </select></label>
        <label><span data-i18n="lbl.botspeed"></span> <select id="botSpeed">
          <option value="0.75">×0.75</option><option value="1">×1.0</option><option value="1.15">×1.15</option>
        </select></label>
        <label><span data-i18n="lbl.ammo"></span> <select id="ammo"><option value="real" data-i18n="ammo.real"></option><option value="inf" data-i18n="ammo.inf"></option></select></label>
        <label><span data-i18n="lbl.goal"></span> <select id="killGoal">
          <option value="10">10</option><option value="20">20</option><option value="30">30</option><option value="40" data-i18n="goal.40"></option><option value="0" data-i18n="goal.none"></option>
        </select></label>
        <label><span data-i18n="lbl.minutes"></span> <select id="minutes">
          <option value="1">1:00</option><option value="2">2:00</option><option value="3">3:00</option><option value="5">5:00</option><option value="9" data-i18n="min.9"></option>
        </select></label>
      </div>
      <div class="mapinfo" id="mapinfo"></div>
      <div id="best" class="best"></div>
      <button id="open-xh" type="button" class="ghost small xh-link" data-i18n="xh.open"></button>
      <button id="start" class="primary"><span>START DEATHMATCH</span><small data-i18n="start.sub"></small></button>
      <div class="keys" id="keys-dm"></div>
    </section>

    <section id="pane-lab" class="panel modes-panel hidden">
      <h2><span data-i18n="drills.h2"></span><small data-i18n="drills.h2s"></small></h2>
      <div id="modes-lab" class="modes"></div>
      <div class="grid g3">
        <label><span data-i18n="lbl.diff.lab"></span> <select id="difficulty-lab">
          <option value="0.7">Easy</option><option value="1">Normal</option><option value="1.35">Hard</option><option value="1.8">Insane</option>
        </select></label>
        <label><span data-i18n="lbl.dur"></span> <select id="duration-lab">
          <option value="30">30s</option><option value="60">60s</option><option value="120">120s</option>
        </select></label>
        <label id="drillgun-l"><span data-i18n="lbl.drillgun"></span> <select id="drillGun"></select></label>
        <label id="drillsec-l"><span data-i18n="lbl.drillsec"></span> <select id="drillSec"></select></label>
      </div>
      <div id="best-lab" class="best"></div>
      <button id="start-lab" class="primary"><span>START DRILL</span><small data-i18n="start.sub"></small></button>
      <div class="keys" id="keys-lab"></div>
    </section>

    <section class="panel">
      <h2><span data-i18n="common.h2"></span><small data-i18n="common.h2s"></small></h2>
      <div class="tabs">
        <button class="on" data-tab="tab-sens" data-i18n="tab.sens"></button>
        <button data-tab="tab-xh" data-i18n="tab.xh"></button>
        <button data-tab="tab-video" data-i18n="tab.video"></button>
        <button data-tab="tab-ctl" data-i18n="tab.ctl"></button>
        <button data-tab="tab-wpn" data-i18n="tab.wpn"></button>
        <button data-tab="tab-formula" data-i18n="tab.formula"></button>
      </div>
      <div id="tab-sens" class="tabpane">
        <div class="grid">
          <label><span data-i18n="lbl.dpi"></span> <input id="dpi" type="number" min="100" max="32000" step="50"></label>
          <label><span data-i18n="lbl.sens"></span> <input id="sens" type="number" min="0.01" max="10" step="0.001"></label>
          <label><span data-i18n="lbl.scoped"></span> <input id="scoped" type="number" min="0.01" max="5" step="0.01"></label>
          <label><span data-i18n="lbl.zoomtime"></span> <select id="zoomTime">
            <option value="0.15">0.15 s</option><option value="0.2">0.20 s</option><option value="0.25">0.25 s</option><option value="0.3">0.30 s</option>
          </select></label>
          <label class="chk"><span data-i18n="lbl.invert"></span><input id="invert" type="checkbox"></label>
        </div>
        <div class="conv">
          <span data-i18n="conv.lbl"></span>
          <select id="conv-game"><option value="cs2">CS2 / CS:GO</option><option value="apex">Apex Legends</option><option value="ow2">Overwatch 2</option><option value="cm">cm/360</option></select>
          <input id="conv-in" type="number" step="0.001" placeholder="1.25">
          <b id="conv-out">—</b>
          <button id="conv-apply" type="button" class="ghost small" data-i18n="conv.apply"></button>
        </div>
        <div class="stats">
          <div class="stat"><span class="k" data-i18n="st.hip"></span><b id="si-hip">—</b><small id="si-hip2"></small></div>
          <div class="stat"><span class="k" data-i18n="st.ads"></span><b id="si-ads">—</b><small id="si-ads2"></small></div>
          <div class="stat"><span class="k" data-i18n="st.fov"></span><b id="si-fov">—</b><small id="si-fov2"></small></div>
        </div>
      </div>
      <div id="tab-xh" class="tabpane hidden">
        <div class="xh-top">
          <div class="seg" id="xh-prof"><button type="button" data-p="xh" class="on" data-i18n="xh.p.primary"></button><button type="button" data-p="xhAds" data-i18n="xh.p.ads"></button><button type="button" data-p="xhSn" data-i18n="xh.p.sniper"></button></div>
          <label id="xh-preset-l"><span data-i18n="xh.preset"></span><select id="xh-preset"><option value="" data-i18n="xh.pr.none"></option><option value="def" data-i18n="xh.pr.def"></option><option value="small" data-i18n="xh.pr.small"></option><option value="plus" data-i18n="xh.pr.plus"></option><option value="dot" data-i18n="xh.pr.dot"></option><option value="crossdot" data-i18n="xh.pr.crossdot"></option><option value="tall" data-i18n="xh.pr.tall"></option><option value="dyn" data-i18n="xh.pr.dyn"></option></select></label>
        </div>
        <label class="chk hidden" id="xh-adson-l"><span data-i18n="xh.adson"></span><input id="xh-adson" type="checkbox"></label>
        <div class="xh-wrap">
          <div class="xh-prev"><canvas id="xh-prev" width="192" height="192"></canvas>
            <div class="seg small" id="xh-bg"><button type="button" data-bg="wall" data-i18n="xh.bg.wall"></button><button type="button" data-bg="sky" data-i18n="xh.bg.sky"></button><button type="button" data-bg="dark" data-i18n="xh.bg.dark"></button><button type="button" data-bg="check" data-i18n="xh.bg.check"></button></div>
            <label class="chk"><span data-i18n="xh.demo"></span><input id="xh-demo" type="checkbox"></label>
          </div>
          <div class="xh-ed" id="xh-ed"></div>
        </div>
        <div class="xh-code">
          <label><span data-i18n="xh.code"></span><input id="xh-code" type="text" spellcheck="false" placeholder="0;P;c;5;h;0;0l;4;0o;2;0a;1;0f;0;1b;0"></label>
          <button id="xh-import" type="button" class="ghost small" data-i18n="xh.import"></button>
          <button id="xh-export" type="button" class="ghost small" data-i18n="xh.export"></button>
          <button id="xh-reset" type="button" class="ghost small" data-i18n="xh.reset"></button>
        </div>
        <div class="note" id="xh-msg" data-i18n="xh.note"></div>
      </div>
      <div id="tab-video" class="tabpane hidden">
        <div class="grid">
          <label><span data-i18n="lbl.enemycolor"></span> <select id="enemyColor"><option value="red" data-i18n="ec.red"></option><option value="yellow" data-i18n="ec.yellow"></option><option value="purple" data-i18n="ec.purple"></option></select></label>
          <label><span data-i18n="lbl.volume"></span> <input id="volume" type="range" min="0" max="1" step="0.05"></label>
          <label class="chk"><span data-i18n="lbl.outline"></span><input id="outline" type="checkbox"></label>
          <label class="chk"><span data-i18n="lbl.viewmodel"></span><input id="viewmodel" type="checkbox"></label>
          <label class="chk"><span data-i18n="lbl.speedo"></span><input id="speedo-chk" type="checkbox"></label>
          <label class="chk"><span data-i18n="lbl.footsteps"></span><input id="footsteps" type="checkbox"></label>
        </div>
        <div class="note" data-i18n-html="note.video"></div>
      </div>
      <div id="tab-ctl" class="tabpane hidden">
        <div class="grid g3">
          <label><span data-i18n="lbl.adsmode"></span> <select id="adsmode"><option value="hold" data-i18n="hold"></option><option value="toggle" data-i18n="toggle"></option></select></label>
          <label><span data-i18n="lbl.crouchmode"></span> <select id="crouchmode"><option value="hold" data-i18n="hold"></option><option value="toggle" data-i18n="toggle"></option></select></label>
          <label><span data-i18n="lbl.walkmode"></span> <select id="walkmode"><option value="hold" data-i18n="hold"></option><option value="toggle" data-i18n="toggle"></option></select></label>
        </div>
        <h3 data-i18n="kb.title"></h3>
        <div id="keybinds" class="keybinds"></div>
        <button id="keys-reset" type="button" class="ghost small" data-i18n="kb.reset"></button>
        <div class="note" data-i18n-html="note.move"></div>
      </div>
      <div id="tab-wpn" class="tabpane hidden">
        <div class="wtable-wrap"><table class="wtable" id="wtable"></table></div>
        <div class="note" data-i18n-html="note.wpn"></div>
      </div>
      <div id="tab-formula" class="tabpane hidden">
<pre data-i18n="formula"></pre>
        <div class="note" data-i18n-html="note.src"></div>
      </div>
    </section>
  </main>

  <div id="results" class="hidden">
    <div class="card">
      <div class="eyebrow">MATCH REPORT</div>
      <div class="score-row"><div id="results-score" class="score">0</div><div id="results-stamp" class="stamp hidden" data-i18n="res.stamp"></div></div>
      <div id="results-title" class="title"></div>
      <div id="results-body"></div>
      <div id="results-tip" class="tip"></div>
      <div id="results-hist" class="hist"></div>
      <div class="actions">
        <button id="again" class="primary"><span>PLAY AGAIN</span></button>
        <button id="share-x" type="button" class="ghost" data-i18n="share.btn"></button>
        <button id="close-results" class="ghost" data-i18n="res.back"></button>
      </div>
      <a id="donate-results" class="donate hidden" href="#" target="_blank" rel="noopener"></a>
    </div>
  </div>

  <div id="guide" class="hidden" role="dialog" aria-modal="true" aria-labelledby="g-title">
    <div class="sheet">
      <div class="g-top"><b id="g-title" data-i18n="guide.title"></b><button id="g-skip" type="button" class="linkbtn" data-i18n="guide.skip"></button></div>
      <div class="g-step">
        <h3 data-i18n="guide.s1.h"></h3><p data-i18n="guide.s1.p"></p>
        <div class="g-pick">
          <button type="button" data-pick="dm"><img data-src="img/mode-dm.webp" alt="" width="110" height="110"><b>DEATHMATCH</b><span data-i18n="guide.s1.dm"></span></button>
          <button type="button" data-pick="lab"><img data-src="img/mode-track.webp" alt="" width="110" height="110"><b>DRILLS</b><span data-i18n="guide.s1.drills"></span></button>
        </div>
      </div>
      <div class="g-step hidden"><img class="g-img" data-src="img/guide-sens.webp" alt="" width="200" height="200"><h3 data-i18n="guide.s2.h"></h3><p data-i18n="guide.s2.p"></p></div>
      <div class="g-step hidden"><img class="g-img" data-src="img/guide-stop.webp" alt="" width="200" height="200"><h3 data-i18n="guide.s3.h"></h3><p data-i18n="guide.s3.p"></p></div>
      <div class="g-step hidden"><img class="g-img" data-src="img/guide-dm.webp" alt="" width="200" height="200"><h3 data-i18n="guide.s4.h"></h3><p data-i18n="guide.s4.p"></p></div>
      <div class="g-nav"><button id="g-prev" type="button" class="ghost" data-i18n="guide.prev"></button><span class="g-dots"><i></i><i></i><i></i><i></i></span><button id="g-next" type="button" class="primary small"></button></div>
    </div>
  </div>

  <footer>
    <span data-i18n="footer"></span>
    <a id="donate-footer" class="donate hidden" href="#" target="_blank" rel="noopener"></a>
  </footer>
</div>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="maps.js"></script>
<script src="engine.js"></script>
<script src="game.js"></script>
<script src="viewmodel.js"></script>
<script src="ui.js"></script>
</body>
</html>
