name: Deploy SIEGE AIM TRAINER (Xserver)

# main に push すると Xserver（https://xs288120.xsrv.jp/skirmish1/）へ FTPS で差分転送する
# 必要な Secrets: XSERVER_FTP_USER / XSERVER_FTP_PASSWORD
#   FTP アカウントは接続先を /xs288120.xsrv.jp/public_html/skirmish1 に限定したものを使う
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: xserver
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: sv16593.xserver.jp
          username: ${{ secrets.XSERVER_FTP_USER }}
          password: ${{ secrets.XSERVER_FTP_PASSWORD }}
          server-dir: ./
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            CLAUDE.md
            HANDOFF.md
            README.md
