name: Deploy SIEGE AIM TRAINER (Xserver)

# main に push すると Xserver（https://raychil.jp/aim/r6s/）へ SSH + rsync で転送する
# 必要な Secret: XSERVER_SSH_KEY（パスフレーズなしの秘密鍵。公開鍵は Xserver の SSH 設定に登録済み）
# この鍵はサーバー側の authorized_keys で rrsync -wo（raychil.jp/public_html/aim/r6s への書き込み専用。2026-10-05 に旧 /R6SAIM から付け替え）に制限済み。
# そのため転送先パスは aim/r6s からの相対パス（./）で指定する。シェルや他フォルダへのアクセスは拒否される。
# Xserver の FTP は国外 IP から繋がらないため SSH（ポート 10022、国外アクセス制限 OFF）を使う
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: xserver
  cancel-in-progress: false

env:
  SSH_HOST: sv16593.xserver.jp
  SSH_PORT: 10022
  SSH_USER: xs288120
  REMOTE_DIR: ./

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.XSERVER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # ホスト鍵は固定（サーバーパネルの ED25519 フィンガープリント SHA256:6n4vNqnPFuTqKTk5kEe+rfJ1yc2c+ZY7IrVQvBy/Sqk と一致）
          echo "[$SSH_HOST]:$SSH_PORT ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGkAfJwujToiUlL6hEr4hrFZzuSbP7mF0iVDwHguGzVS" >> ~/.ssh/known_hosts
      - name: Upload via rsync
        run: |
          rsync -rlvz --delete \
            --exclude '.git*' --exclude '.github/' --exclude '.claude/' \
            --exclude 'CLAUDE.md' --exclude 'README.md' --exclude 'tools/' \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT -o ConnectTimeout=30" \
            ./ "$SSH_USER@$SSH_HOST:$REMOTE_DIR"
